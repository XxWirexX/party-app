name: Tests

on:
  push:
    branches-ignore: [main] # sur main, les tests tournent dans le workflow de déploiement
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: zeste
          POSTGRES_PASSWORD: zeste
          POSTGRES_DB: zeste_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zeste -d zeste_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://zeste:zeste@localhost:5432/zeste_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
