# Base Postgres locale pour le développement : docker compose up -d
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: zeste
      POSTGRES_PASSWORD: zeste
      POSTGRES_DB: zeste
    ports:
      - "5432:5432"
    volumes:
      - zeste-db:/var/lib/postgresql/data
volumes:
  zeste-db:
