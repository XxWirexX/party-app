<title>Zeste</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#FFD43B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap">
<style>
/* Layout : une app plein écran en colonne (vue qui défile + barre d'onglets flottante).
   Chaque onglet est un « monde » de couleur qui inonde le fond ; les contenus sont des
   autocollants à contour encre et ombre dure. Le mode soirée bascule tout en nuit. */
:root{
  --w-sun:#FFD43B; --w-pink:#FF9BD2; --w-mint:#6FE3A5; --w-orange:#FF9248; --w-sky:#7CC4FF; --w-violet:#A77BFF;
  --lime:#8BDD3C; --lime-flesh:#E6FF8A; --lime-seg:#B4E84E;
  --yes:#3ED583; --maybe:#FFBB33; --no:#FF6B6B; --wait:#C9BCD9;
  --ink:#1D0F2E; --white:#FFFFFF;
  --world:var(--w-sun);
  --mode:light;
  --bg:var(--world);
  --fg:#1D0F2E;
  --muted:rgba(29,15,46,.66);
  --card:#FFFFFF;
  --card2:#F3ECFA;
  --line:#1D0F2E;
  --shadow:#1D0F2E;
  --title:#1D0F2E;
  --btn-bg:#1D0F2E; --btn-fg:#FFFFFF; --btn-edge:#000000;
  --bar:#1D0F2E; --bar-fg:#FFFFFF;
  --veil:rgba(29,15,46,.55);
  --f-display:"Bagel Fat One","Arial Black",Impact,sans-serif;
  --f-body:"Bricolage Grotesque",ui-rounded,"Segoe UI",system-ui,sans-serif;
  --spring:cubic-bezier(.2,1.4,.35,1);
  --out:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --mode:dark; --bg:#160A24; --fg:#FBF3FF; --muted:rgba(251,243,255,.64); --card:#27143D; --card2:#351D52;
    --line:#07020D; --shadow:var(--world); --title:var(--world);
    --btn-bg:var(--world); --btn-fg:#1D0F2E; --btn-edge:#07020D; --bar:#07020D; --bar-fg:#FBF3FF;
    --veil:rgba(4,1,8,.7); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --mode:dark; --bg:#160A24; --fg:#FBF3FF; --muted:rgba(251,243,255,.64); --card:#27143D; --card2:#351D52;
  --line:#07020D; --shadow:var(--world); --title:var(--world);
  --btn-bg:var(--world); --btn-fg:#1D0F2E; --btn-edge:#07020D; --bar:#07020D; --bar-fg:#FBF3FF;
  --veil:rgba(4,1,8,.7); color-scheme:dark;
}
:root[data-world="guests"]{--world:var(--w-pink)}
:root[data-world="shop"]{--world:var(--w-mint)}
:root[data-world="bar"]{--world:var(--w-orange)}
:root[data-world="gallery"]{--world:var(--w-sky)}
/* Le mode soirée est un monde volontairement nocturne, quel que soit le thème. */
:root[data-world="night"]{
  --world:var(--w-violet);
  --mode:night; --bg:#12071F; --fg:#FBF3FF; --muted:rgba(251,243,255,.64); --card:#24123A; --card2:#33194F;
  --line:#05010A; --shadow:var(--world); --title:#FBF3FF;
  --btn-bg:var(--world); --btn-fg:#1D0F2E; --btn-edge:#05010A; --bar:#05010A; --bar-fg:#FBF3FF;
  --veil:rgba(4,1,8,.75); color-scheme:dark;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:500 16px/1.4 var(--f-body);overflow:hidden;transition:background-color .35s;
  -webkit-font-smoothing:antialiased;overscroll-behavior:none;touch-action:manipulation}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--fg);outline-offset:3px}
h1,h2,h3,p,ul{margin:0;padding:0}
ul{list-style:none}
svg{display:block}

#wipe{position:fixed;inset:0;z-index:0;pointer-events:none;clip-path:circle(0 at 50% 50%)}
#wipe.go{transition:clip-path .55s var(--out);clip-path:circle(150% at var(--x,50%) var(--y,50%))}
#app{position:relative;z-index:1;height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column}
#view{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:14px 120px;display:flex;flex-direction:column;gap:18px}
#view::-webkit-scrollbar{display:none}
#view>*{flex-shrink:0}
#view.no-tabs{padding-bottom:32px}
#view.leave{opacity:0;transform:scale(.97);transition:opacity .12s,transform .12s}
#view.enter>*{animation:rise .55s var(--spring) both}
#view.enter>*:nth-child(2){animation-delay:.05s}#view.enter>*:nth-child(3){animation-delay:.1s}
#view.enter>*:nth-child(4){animation-delay:.15s}#view.enter>*:nth-child(5){animation-delay:.2s}
#view.enter>*:nth-child(6){animation-delay:.25s}#view.enter>*:nth-child(n+7){animation-delay:.3s}
@keyframes rise{from{opacity:0;transform:translateY(26px) scale(.96)}}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes wiggle{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.pop{animation:pop .45s var(--spring)}

/* ---------- typo ---------- */
.display{font-family:var(--f-display);font-weight:400;line-height:1;letter-spacing:.01em;text-wrap:balance}
.title{font-family:var(--f-display);font-weight:400;font-size:44px;line-height:.95;color:var(--title);text-wrap:balance}
.h2{font-family:var(--f-display);font-weight:400;font-size:22px;line-height:1.05}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* ---------- briques ---------- */
.card{background:var(--card);border:2.5px solid var(--line);border-radius:24px;box-shadow:4px 5px 0 var(--shadow);padding:16px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:54px;padding:12px 22px;border-radius:18px;
  background:var(--btn-bg);color:var(--btn-fg);font-weight:800;font-size:17px;border:2.5px solid var(--line);
  box-shadow:0 5px 0 var(--btn-edge);transition:transform .08s,box-shadow .08s;text-align:center;width:100%}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--btn-edge)}
.btn.alt{background:var(--card);color:var(--fg);box-shadow:0 5px 0 var(--shadow)}
.btn.alt:active{box-shadow:0 1px 0 var(--shadow)}
.btn.world{background:var(--world);color:var(--ink)}
.btn.danger{background:var(--no);color:var(--ink)}
.btn.sm{min-height:42px;padding:8px 14px;font-size:15px;border-radius:14px;width:auto;box-shadow:0 4px 0 var(--btn-edge)}
.btn.sm.alt{box-shadow:0 4px 0 var(--shadow)}
.btn[disabled]{opacity:.45;pointer-events:none}
.row-btns{display:flex;gap:10px;flex-wrap:wrap}
.row-btns>.btn{flex:1;min-width:140px}
.ico-btn{width:44px;height:44px;border-radius:50%;background:var(--card);border:2.5px solid var(--line);display:grid;place-items:center;
  box-shadow:2px 3px 0 var(--shadow);flex:none;transition:transform .1s}
.ico-btn:active{transform:translate(2px,3px);box-shadow:none}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;border:2.5px solid var(--line);
  background:var(--card);font-weight:700;font-size:14px;white-space:nowrap;transition:transform .15s var(--spring)}
.chip:active{transform:scale(.93)}
.chip.on{background:var(--fg);color:var(--bg)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px;padding-block:2px}
.chips.scroll::-webkit-scrollbar{display:none}
.tag{display:inline-block;padding:2px 8px;border-radius:8px;background:var(--card2);font-size:12px;font-weight:800}

.seg{display:flex;background:var(--card);border:2.5px solid var(--line);border-radius:16px;padding:4px;gap:4px}
.seg button{flex:1;padding:9px 8px;border-radius:11px;font-weight:800;font-size:14px;text-align:center;transition:background .2s,color .2s}
.seg button.on{background:var(--fg);color:var(--card)}

.list{background:var(--card);border:2.5px solid var(--line);border-radius:22px;box-shadow:4px 5px 0 var(--shadow);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:2px solid var(--card2)}
.row:first-child{border-top:0}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.row-main b{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-main small{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.done .row-main b{text-decoration:line-through;opacity:.5}
.list-label{display:flex;justify-content:space-between;align-items:baseline;padding:0 4px}

/* ---------- Limo ---------- */
.limo{overflow:visible;flex:none}
.limo .body{animation:bob 2.6s ease-in-out infinite;transform-origin:60px 110px}
.limo .eye{animation:blink 4.2s infinite;transform-box:fill-box;transform-origin:center}
.limo .arm-r{transform-origin:98px 66px;animation:wave 1.6s ease-in-out infinite}
.limo .shadow{animation:shade 2.6s ease-in-out infinite;transform-origin:60px 114px}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-5px) rotate(2deg)}}
@keyframes shade{50%{transform:scaleX(.82)}}
@keyframes blink{0%,46%,50%,100%{transform:scaleY(1)}48%{transform:scaleY(.1)}}
@keyframes wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-28deg)}}
.limo-say{display:flex;align-items:flex-end;gap:6px}
.bubble{position:relative;background:var(--card);border:2.5px solid var(--line);border-radius:20px 20px 20px 6px;padding:12px 15px;
  font-weight:700;font-size:16px;line-height:1.3;box-shadow:3px 4px 0 var(--shadow);min-width:0;flex:1;margin-bottom:26px}
.bubble .btn{margin-top:10px}

#coach{position:absolute;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:104px;z-index:6;display:flex;align-items:flex-end;gap:4px;
  transform:translateY(calc(100% + 160px));visibility:hidden;transition:transform .5s var(--spring),visibility 0s .5s;pointer-events:none}
#coach.on{transform:none;visibility:visible;transition:transform .5s var(--spring);pointer-events:auto}
#coach .bubble{margin-bottom:18px;font-size:15px}
#coach.low{bottom:20px}

/* ---------- barre d'onglets ---------- */
#tabs{position:absolute;z-index:5;bottom:12px;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));
  background:var(--bar);color:var(--bar-fg);border:2.5px solid var(--line);border-radius:26px;padding:6px;display:flex;
  box-shadow:0 8px 24px rgba(0,0,0,.28);animation:rise .5s var(--spring) both}
#tabs button{flex:1;position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 6px;
  font-size:11px;font-weight:800;text-align:center;transition:color .25s}
#tabs button svg{transition:transform .35s var(--spring)}
#tabs button.on{color:var(--ink)}
#tabs button.on svg{transform:translateY(-2px) scale(1.12) rotate(-6deg)}
#tabs .blob{position:absolute;z-index:0;top:6px;bottom:6px;left:6px;width:calc((100% - 12px)/5);border-radius:20px;background:var(--world);
  transform:translateX(calc(var(--i,0)*100%));transition:transform .5s var(--spring),background-color .3s}

/* ---------- accueil ---------- */
.home-head{display:flex;justify-content:space-between;align-items:center}
.logo{font-family:var(--f-display);font-size:34px;line-height:1;color:var(--title);display:flex;align-items:center;gap:6px}
.logo i{width:20px;height:20px;border-radius:50%;background:var(--lime);border:2.5px solid var(--line);display:inline-block;animation:wiggle 2s infinite}
.me-chip{height:44px;padding:0 14px;border-radius:999px;background:var(--card);border:2.5px solid var(--line);font-weight:800;box-shadow:2px 3px 0 var(--shadow)}
.ticket{display:flex;width:100%;background:var(--card);border:2.5px solid var(--line);border-radius:22px;box-shadow:5px 6px 0 var(--shadow);
  overflow:hidden;transform:rotate(var(--tilt,0deg));transition:transform .25s var(--spring)}
.ticket:active{transform:rotate(0) scale(.97)}
.tk-main{flex:1;min-width:0;padding:16px;display:flex;flex-direction:column;gap:6px}
.tk-main h3{font-family:var(--f-display);font-weight:400;font-size:26px;line-height:1;margin:0;overflow-wrap:anywhere}
.tk-main p{font-size:14px;font-weight:600;color:var(--muted)}
.tk-emo{font-size:30px;line-height:1}
.tk-stub{flex:none;width:92px;background:var(--c,var(--world));color:var(--ink);border-left:2.5px dashed var(--line);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;padding:10px 6px;text-align:center}
.tk-stub b{font-family:var(--f-display);font-weight:400;font-size:28px;line-height:1}
.tk-stub span{font-size:12px;font-weight:800}
.ticket.past{filter:saturate(.55)}
.stack{display:flex;flex-direction:column;gap:14px}
.note{font-size:13px;font-weight:700;padding:8px 12px;border-radius:12px;background:var(--card);border:2px dashed var(--line)}

/* ---------- assistant de création ---------- */
.wz-top{display:flex;align-items:center;gap:12px}
.wz-bar{flex:1;height:16px;border-radius:99px;background:var(--card);border:2.5px solid var(--line);overflow:hidden}
.wz-bar i{display:block;height:100%;background:var(--lime);border-right:2.5px solid var(--line);border-radius:99px;transition:width .5s var(--spring)}
.wz-body{display:flex;flex-direction:column;gap:14px}
.wz-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.in{width:100%;font:inherit;font-weight:700;font-size:17px;padding:14px 16px;border:2.5px solid var(--line);border-radius:16px;background:var(--card);color:var(--fg);min-width:0}
.sheet .in{background:var(--card2)}
.in::placeholder{color:var(--muted);font-weight:500}
select.in{appearance:none}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:800;min-width:0;flex:1}
.f-row{display:flex;gap:10px}
.theme-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.theme{display:flex;align-items:center;gap:10px;padding:14px;border-radius:18px;background:var(--card);border:2.5px solid var(--line);font-weight:800;
  transition:transform .2s var(--spring)}
.theme span{font-size:26px}
.theme.on{background:var(--c);color:var(--ink);transform:rotate(-2deg) scale(1.03);box-shadow:3px 4px 0 var(--shadow)}
.stepper{display:flex;align-items:center;justify-content:center;gap:18px}
.stepper b{font-family:var(--f-display);font-weight:400;font-size:84px;line-height:1;min-width:2ch;text-align:center;color:var(--title)}
.stepper.sm b{font-size:30px;min-width:2.2ch;color:var(--fg)}
.stepper.sm{gap:10px}

/* ---------- soirée ---------- */
.p-head{display:flex;align-items:center;gap:10px}
.p-name{flex:1;min-width:0;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.night-btn{display:flex;align-items:center;gap:6px;height:44px;padding:0 14px;border-radius:999px;background:var(--ink);color:var(--white);border:2.5px solid var(--line);
  font-weight:800;font-size:14px;flex:none;box-shadow:2px 3px 0 var(--shadow)}
.night-btn svg{animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.title-row{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.cd{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cd div{background:var(--fg);color:var(--card);border-radius:16px;padding:10px 4px 8px;text-align:center}
.cd b{display:block;font-family:var(--f-display);font-weight:400;font-size:32px;line-height:1;font-variant-numeric:tabular-nums}
.cd span{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;opacity:.75}
.cd .tick b{animation:pop .3s}
.hero-meta{display:flex;flex-direction:column;gap:2px;font-weight:700}
.gauges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.gauge-card{background:var(--card);border:2.5px solid var(--line);border-radius:20px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;
  text-align:center;box-shadow:3px 4px 0 var(--shadow);transition:transform .2s var(--spring)}
.gauge-card:active{transform:scale(.94)}
.gauge-card small{font-size:12px;font-weight:700;color:var(--muted);line-height:1.2}
.ring{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;border:2.5px solid var(--line);
  background:conic-gradient(var(--c,var(--world)) calc(var(--p,0)*1%),var(--card2) 0)}
.ring b{width:42px;height:42px;border-radius:50%;background:var(--card);border:2.5px solid var(--line);display:grid;place-items:center;font-size:14px;font-weight:800}
.night-cta{position:relative;overflow:hidden;background:var(--ink);color:var(--white);border:2.5px solid var(--line);border-radius:24px;padding:18px;display:flex;align-items:center;gap:14px;
  box-shadow:4px 5px 0 var(--w-violet);width:100%;transition:transform .15s}
.night-cta:active{transform:scale(.97)}
.night-cta b{font-family:var(--f-display);font-weight:400;font-size:24px;line-height:1;display:block}
.night-cta small{color:var(--w-violet);font-weight:700}
.disco{width:56px;height:56px;border-radius:50%;flex:none;border:2.5px solid var(--white);
  background:repeating-conic-gradient(var(--w-violet) 0 20deg,var(--w-pink) 20deg 40deg,var(--w-sky) 40deg 60deg);animation:spin 5s linear infinite}
.check{width:32px;height:32px;border-radius:11px;border:2.5px solid var(--line);background:var(--card2);display:grid;place-items:center;flex:none;color:transparent;
  transition:background .2s,transform .25s var(--spring)}
.check.on{background:var(--yes);color:var(--ink);transform:rotate(-6deg)}
.when{font-size:11px;font-weight:800;padding:3px 7px;border-radius:8px;background:var(--card2);flex:none;min-width:48px;text-align:center}

/* ---------- invités ---------- */
.statbar{display:flex;height:22px;border-radius:99px;border:2.5px solid var(--line);overflow:hidden;background:var(--card2)}
.statbar i{display:block;transition:flex-grow .6s var(--spring);min-width:0}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;font-weight:700}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);border:2px solid var(--line);margin-right:5px}
.big-count{display:flex;align-items:baseline;gap:10px}
.big-count b{font-family:var(--f-display);font-weight:400;font-size:64px;line-height:.9}
.ava{width:42px;height:42px;border-radius:14px;border:2.5px solid var(--line);display:grid;place-items:center;font-weight:800;font-size:14px;flex:none;
  background:hsl(var(--h) 90% 76%);color:var(--ink);transform:rotate(-4deg)}
.status{padding:7px 11px;border-radius:999px;border:2.5px solid var(--line);font-size:13px;font-weight:800;flex:none;color:var(--ink);background:var(--wait);transition:transform .15s}
.status:active{transform:scale(.9)}
.s-yes{background:var(--yes)}.s-maybe{background:var(--maybe)}.s-no{background:var(--no)}
.invite{background:var(--card);border:2.5px dashed var(--line);border-radius:20px;padding:14px;font-weight:600;white-space:pre-wrap;font-size:15px;user-select:text;-webkit-user-select:text}

/* ---------- courses ---------- */
.budget{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.budget b{display:block;font-family:var(--f-display);font-weight:400;font-size:22px;line-height:1.1;font-variant-numeric:tabular-nums}
.budget small{font-size:12px;font-weight:700;color:var(--muted)}
.price{font-weight:800;font-size:14px;font-variant-numeric:tabular-nums;flex:none}
.lvl{display:flex;gap:4px;flex:none}
.lvl button{width:20px;height:32px;border-radius:7px;border:2.5px solid var(--line);background:var(--card2)}
.lvl button.f{background:var(--c)}
.alert{background:var(--no);color:var(--ink);border:2.5px solid var(--line);border-radius:18px;padding:12px 14px;font-weight:800;box-shadow:3px 4px 0 var(--shadow)}
.sugg{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:2px solid var(--card2)}
.sugg:first-of-type{border-top:0}
.sugg span{flex:1;font-weight:700}

/* ---------- bar ---------- */
.bar-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.ck{background:var(--card);border:2.5px solid var(--line);border-radius:22px;padding:12px 10px 12px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;
  box-shadow:3px 4px 0 var(--shadow);transition:transform .2s var(--spring);position:relative;min-width:0}
.ck:nth-child(odd){transform:rotate(-1.2deg)}.ck:nth-child(even){transform:rotate(1deg)}
